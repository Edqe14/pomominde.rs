[package]
name = "pomominders"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
gpui-fps = "0.9"
gpui-kit = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# GPUI is too slow unoptimized (laggy animations); optimize deps, keep our crate quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSColor", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "CIColor", "CIFilter", "CIImage", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSKeyValueCoding", "NSString", "NSValue"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
raw-window-handle = "0.6"

# `cargo bundle --release` builds Pomominders.app (cargo install cargo-bundle).
[package.metadata.bundle]
name = "Pomominders"
identifier = "me.edqe14.pomominders"
icon = ["assets/icon.icns"]
category = "public.app-category.productivity"
short_description = "A minimal pomodoro timer"
